services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pari
      POSTGRES_PASSWORD: pari
      POSTGRES_DB: pari
    ports:
      - "5432:5432"
    volumes:
      - pari-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pari -d pari"]
      interval: 5s
      retries: 10

volumes:
  pari-pg:
